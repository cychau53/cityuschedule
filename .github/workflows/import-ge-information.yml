name: Import GE course information

on:
  workflow_dispatch:
    inputs:
      course_codes:
        description: "GE course codes separated by spaces or commas"
        required: true
        default: "GE1102"
        type: string

permissions:
  contents: write

concurrency:
  group: import-ge-information-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Fetch and save GE information
        env:
          COURSE_CODES: ${{ inputs.course_codes }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from cityuschedule.ge_course_information_importer import (
              fetch_ge_course_information,
              merge_ge_course_information_from_web,
          )

          codes = (
              os.environ["COURSE_CODES"]
              .replace(",", " ")
              .split()
          )

          output = Path("data/ge_course_information.json")

          successful_codes = []
          skipped_codes = []
          total_records = 0

          for code in codes:
              try:
                  records = fetch_ge_course_information(
                      code,
                      timeout=60,
                  )
              except ValueError as error:
                  message = str(error)

                  if (
                      "No recognizable Course Section table found"
                      in message
                      or "no section rows were extracted" in message
                  ):
                      skipped_codes.append(code)
                      print(f"Skipped {code}: {message}")
                      continue

                  raise

              successful_codes.append(code)
              total_records += len(records)

          if not successful_codes:
              raise SystemExit(
                  "No requested GE course had published section "
                  "information; refusing to commit."
              )

          merge_ge_course_information_from_web(
              successful_codes,
              output_path=output,
              timeout=60,
          )

          print(
              f"Updated {len(successful_codes)} course(s) with "
              f"{total_records} section record(s)."
          )

          if skipped_codes:
              print(
                  "Skipped courses without published section "
                  f"information: {', '.join(skipped_codes)}"
              )
          PY
      - name: Validate JSON
        run: |
          python -m json.tool data/ge_course_information.json > /dev/null

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/ge_course_information.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GE course section information"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
